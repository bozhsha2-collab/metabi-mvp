<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Retail BI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.chart-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.kpi {
  font-size: 22px;
  font-weight: bold;
}

canvas {
  height: 220px !important;
}

#map {
  height: 320px;
}

select, input {
  padding: 6px;
  margin: 5px;
}

@media (max-width: 900px) {
  .kpi-grid, .chart-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>📊 Retail BI Dashboard (Бытовая техника)</h1>

<!-- FILTERS -->
<div class="card">
  <label>Город:</label>
  <select id="city"><option value="All">Все</option></select>

  <label>Товар:</label>
  <select id="product"><option value="All">Все</option></select>

  <label>Количество строк:</label>
  <input type="range" id="range" min="10" max="50" value="50">
</div>

<!-- KPI -->
<div class="kpi-grid">
  <div class="card">
    <div>Общие продажи</div>
    <div class="kpi" id="total">0</div>
  </div>

  <div class="card">
    <div>Среднее</div>
    <div class="kpi" id="avg">0</div>
  </div>

  <div class="card">
    <div>Макс продажа</div>
    <div class="kpi" id="max">0</div>
  </div>
</div>

<!-- CHARTS -->
<div class="chart-grid">
  <div class="card"><canvas id="bar"></canvas></div>
  <div class="card"><canvas id="line"></canvas></div>
  <div class="card"><canvas id="pie"></canvas></div>
</div>

<!-- MAP -->
<div class="card">
  <h3>🗺️ Продажи по городам</h3>
  <div id="map"></div>
</div>

<script>

let raw = [];

/* ---------- fallback ---------- */
function generateData(){
  const cities = ["Алматы","Астана","Шымкент","Караганда"];
  const products = ["Стиральная машина","Холодильник","Телевизор","Пылесос","Микроволновка","Кондиционер"];

  let arr=[];
  for(let i=0;i<50;i++){
    arr.push({
      Дата:"2025-01-"+((i%30)+1),
      Месяц: i<30 ? "Янв":"Фев",
      Город:cities[Math.floor(Math.random()*cities.length)],
      Товар:products[Math.floor(Math.random()*products.length)],
      Продажи:Math.floor(Math.random()*3000+200),
      Количество:Math.floor(Math.random()*5+1)
    });
  }
  return arr;
}

/* ---------- load ---------- */
fetch("./data.json")
.then(r=>r.json())
.then(d=>{
  raw = Array.isArray(d)&&d.length?d:generateData();
  init();
  render();
})
.catch(()=>{
  raw = generateData();
  init();
  render();
});

/* ---------- init ---------- */
function init(){

  const citySel = document.getElementById("city");
  const prodSel = document.getElementById("product");

  [...new Set(raw.map(x=>x.Город))].forEach(v=>citySel.appendChild(new Option(v,v)));
  [...new Set(raw.map(x=>x.Товар))].forEach(v=>prodSel.appendChild(new Option(v,v)));

  citySel.onchange = render;
  prodSel.onchange = render;
  range.oninput = render;

  initMap();
}

/* ---------- filter ---------- */
function getData(){

  const city = document.getElementById("city").value;
  const product = document.getElementById("product").value;

  return raw
    .filter(x => city==="All" || x.Город===city)
    .filter(x => product==="All" || x.Товар===product)
    .slice(0, range.value);
}

/* ---------- charts ---------- */
let bar,line,pie,map;

function render(){

  const data = getData();
  if(!data.length) return;

  let total = data.reduce((s,x)=>s+Number(x.Продажи),0);
  let avg = total / data.length;
  let max = Math.max(...data.map(x=>x.Продажи));

  document.getElementById("total").innerText = total;
  document.getElementById("avg").innerText = avg.toFixed(1);
  document.getElementById("max").innerText = max;

  const labels = data.map(x=>x.Город);
  const values = data.map(x=>x.Продажи);

  if(bar) bar.destroy();
  if(line) line.destroy();
  if(pie) pie.destroy();

  bar = new Chart(document.getElementById("bar"),{
    type:"bar",
    data:{labels,datasets:[{label:"Продажи",data:values}]}
  });

  line = new Chart(document.getElementById("line"),{
    type:"line",
    data:{labels,datasets:[{label:"Тренд",data:values}]}
  });

  let grouped = {};
  data.forEach(x=>{
    grouped[x.Товар]=(grouped[x.Товар]||0)+x.Продажи;
  });

  pie = new Chart(document.getElementById("pie"),{
    type:"pie",
    data:{
      labels:Object.keys(grouped),
      datasets:[{data:Object.values(grouped)}]
    }
  });

  updateMap(data);
}

/* ---------- map ---------- */
function initMap(){
  map = L.map("map").setView([48,68],4);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"Retail BI"
  }).addTo(map);
}

function updateMap(data){

  if(!map) return;

  map.eachLayer(l=>{
    if(l._latlng) map.removeLayer(l);
  });

  const coords = {
    "Алматы":[43.2389,76.8897],
    "Астана":[51.1694,71.4491],
    "Шымкент":[42.3417,69.5901],
    "Караганда":[49.8061,73.0854]
  };

  let grouped={};

  data.forEach(x=>{
    grouped[x.Город]=(grouped[x.Город]||0)+x.Продажи;
  });

  Object.keys(grouped).forEach(city=>{
    L.circle(coords[city]||[48,68],{
      radius:grouped[city]/5,
      color:"red"
    }).addTo(map).bindPopup(`${city}: ${grouped[city]}`);
  });
}

</script>

</body>
</html>
