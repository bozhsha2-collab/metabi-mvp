<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MetaBI PRO v1</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

/* layout */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.chart-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.card {
  background: #1e293b;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}

canvas { height: 220px !important; }

#map { height: 320px; }

select, input {
  padding: 6px;
  margin: 5px;
}

.kpi {
  font-size: 22px;
  font-weight: bold;
}

/* clickable chart */
canvas { cursor: pointer; }

@media (max-width: 900px) {
  .chart-grid, .kpi-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>📊 MetaBI PRO v1</h1>

<!-- FILTERS -->
<div class="card">
  <label>Region:</label>
  <select id="region"><option value="All">All</option></select>

  <label>Category:</label>
  <select id="category"><option value="All">All</option></select>

  <label>Sales filter:</label>
  <input type="range" id="range" min="50" max="1000" value="1000">
</div>

<!-- KPI -->
<div class="kpi-grid">
  <div class="card"><div>Total</div><div class="kpi" id="total">0</div></div>
  <div class="card"><div>Avg</div><div class="kpi" id="avg">0</div></div>
  <div class="card"><div>Growth</div><div class="kpi" id="growth">0%</div></div>
</div>

<!-- CHARTS -->
<div class="chart-grid">
  <div class="card"><canvas id="bar"></canvas></div>
  <div class="card"><canvas id="line"></canvas></div>
  <div class="card"><canvas id="pie"></canvas></div>
</div>

<!-- MAP -->
<div class="card">
  <h3>🗺️ Sales Heatmap</h3>
  <div id="map"></div>
</div>

<script>

let raw = [];
let selectedRegion = "All";

/* ---------- DATA ---------- */
function generateData(){
  const regions=["North","South","East","West","Central"];
  const cats=["A","B","C"];

  let arr=[];
  for(let i=0;i<1000;i++){
    arr.push({
      Day:i,
      Month:"M"+(i%12),
      Sales:Math.floor(Math.random()*5000+100),
      Region:regions[Math.floor(Math.random()*regions.length)],
      Category:cats[Math.floor(Math.random()*cats.length)]
    });
  }
  return arr;
}

/* ---------- LOAD ---------- */
fetch("./data.json")
.then(r=>r.json())
.then(d=>{
  raw = Array.isArray(d)&&d.length?d:generateData();
  init();
  render();
})
.catch(()=>{
  raw = generateData();
  init();
  render();
});

/* ---------- INIT ---------- */
function init(){
  const r=document.getElementById("region");
  const c=document.getElementById("category");

  [...new Set(raw.map(x=>x.Region))].forEach(v=>r.appendChild(new Option(v,v)));
  [...new Set(raw.map(x=>x.Category))].forEach(v=>c.appendChild(new Option(v,v)));

  r.onchange=()=>{selectedRegion=r.value; render();};
  c.onchange=render;
  range.oninput=render;

  initMap();
}

/* ---------- FILTER ---------- */
function getData(){
  return raw
    .filter(x=>selectedRegion==="All"||x.Region===selectedRegion)
    .slice(0,range.value);
}

/* ---------- CHARTS ---------- */
let bar,line,pie,map;

function render(){

  const data=getData();
  if(!data.length) return;

  let total=data.reduce((s,x)=>s+x.Sales,0);
  let avg=total/data.length;

  /* growth */
  let growth=((data[data.length-1].Sales-data[0].Sales)/data[0].Sales*100).toFixed(1);

  document.getElementById("total").innerText=total;
  document.getElementById("avg").innerText=avg.toFixed(1);
  document.getElementById("growth").innerText=growth+"%";

  let labels=data.map(x=>x.Month);
  let values=data.map(x=>x.Sales);

  if(bar) bar.destroy();
  if(line) line.destroy();
  if(pie) pie.destroy();

  /* CLICK INTERACTION */
  bar=new Chart(document.getElementById("bar"),{
    type:"bar",
    data:{labels,datasets:[{label:"Sales",data:values}]},
    options:{
      onClick:(e,items)=>{
        if(items.length){
          selectedRegion=data[items[0].index].Region;
          render();
        }
      }
    }
  });

  line=new Chart(document.getElementById("line"),{
    type:"line",
    data:{labels,datasets:[{label:"Trend",data:values}]}
  });

  let grouped={};
  data.forEach(x=>{
    grouped[x.Region]=(grouped[x.Region]||0)+x.Sales;
  });

  pie=new Chart(document.getElementById("pie"),{
    type:"pie",
    data:{
      labels:Object.keys(grouped),
      datasets:[{data:Object.values(grouped)}]
    }
  });

  updateMap(data);
}

/* ---------- MAP ---------- */
function initMap(){
  map=L.map("map").setView([48,68],4);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"MetaBI PRO"
  }).addTo(map);
}

function updateMap(data){
  if(!map) return;

  map.eachLayer(l=>{
    if(l._latlng) map.removeLayer(l);
  });

  const coords={
    North:[53,70],
    South:[42,69],
    East:[49,82],
    West:[44,63],
    Central:[48,71]
  };

  let grouped={};
  data.forEach(x=>{
    grouped[x.Region]=(grouped[x.Region]||0)+x.Sales;
  });

  Object.keys(grouped).forEach(r=>{
    L.circle(coords[r]||[48,68],{
      radius:grouped[r]/10,
      color:"red"
    }).addTo(map).bindPopup(`${r}: ${grouped[r]}`);
  });
}

</script>

</body>
</html>
