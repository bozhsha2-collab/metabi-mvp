<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Retail BI FIX</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.kpi {
  font-size: 22px;
  font-weight: bold;
}

canvas { height: 220px !important; }

#map { height: 320px; }

select, input {
  padding: 6px;
  margin: 5px;
}
</style>
</head>

<body>

<h2>📊 Retail BI FIX (рабочие срезы)</h2>

<!-- FILTERS -->
<div class="card">
  <label>Город:</label>
  <select id="city"><option value="ALL">Все</option></select>

  <label>Товар:</label>
  <select id="product"><option value="ALL">Все</option></select>

  <label>Строки:</label>
  <input type="range" id="range" min="10" max="50" value="50">
</div>

<!-- KPI -->
<div class="grid">
  <div class="card">Total<br><div class="kpi" id="total">0</div></div>
  <div class="card">Avg<br><div class="kpi" id="avg">0</div></div>
  <div class="card">Max<br><div class="kpi" id="max">0</div></div>
</div>

<!-- CHARTS -->
<div class="grid">
  <div class="card"><canvas id="bar"></canvas></div>
  <div class="card"><canvas id="line"></canvas></div>
  <div class="card"><canvas id="pie"></canvas></div>
</div>

<div class="card">
  <div id="map"></div>
</div>

<script>

let raw = [];
let map;

/* ---------- LOAD ---------- */
fetch("./data.json")
.then(r=>r.json())
.then(d=>{
  raw = d;
  init();
  render();
});

/* ---------- INIT ---------- */
function init(){

  const citySel = document.getElementById("city");
  const prodSel = document.getElementById("product");

  [...new Set(raw.map(x=>x.Город))].forEach(v=>{
    citySel.appendChild(new Option(v,v));
  });

  [...new Set(raw.map(x=>x.Товар))].forEach(v=>{
    prodSel.appendChild(new Option(v,v));
  });

  citySel.onchange = render;
  prodSel.onchange = render;
  range.oninput = render;

  map = L.map("map").setView([48,68],4);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
}

/* ---------- FILTER ---------- */
function getData(){

  const city = document.getElementById("city").value;
  const product = document.getElementById("product").value;
  const limit = Number(document.getElementById("range").value);

  return raw
    .filter(x => city==="ALL" || x.Город===city)
    .filter(x => product==="ALL" || x.Товар===product)
    .slice(0, limit);
}

/* ---------- CHARTS ---------- */
let bar,line,pie;

function render(){

  const data = getData();
  if(!data.length) return;

  const total = data.reduce((s,x)=>s+Number(x.Продажи),0);
  const avg = total / data.length;
  const max = Math.max(...data.map(x=>x.Продажи));

  document.getElementById("total").innerText = total;
  document.getElementById("avg").innerText = avg.toFixed(1);
  document.getElementById("max").innerText = max;

  const labels = data.map(x=>x.Город);
  const values = data.map(x=>x.Продажи);

  if(bar) bar.destroy();
  if(line) line.destroy();
  if(pie) pie.destroy();

  bar = new Chart(document.getElementById("bar"),{
    type:"bar",
    data:{labels,datasets:[{label:"Продажи",data:values}]}
  });

  line = new Chart(document.getElementById("line"),{
    type:"line",
    data:{labels,datasets:[{label:"Тренд",data:values}]}
  });

  let grouped = {};
  data.forEach(x=>{
    grouped[x.Товар]=(grouped[x.Товар]||0)+x.Продажи;
  });

  pie = new Chart(document.getElementById("pie"),{
    type:"pie",
    data:{
      labels:Object.keys(grouped),
      datasets:[{data:Object.values(grouped)}]
    }
  });

  updateMap(data);
}

/* ---------- MAP ---------- */
function updateMap(data){

  map.eachLayer(l=>{
    if(l._latlng) map.removeLayer(l);
  });

  const coords = {
    "Алматы":[43.2389,76.8897],
    "Астана":[51.1694,71.4491],
    "Шымкент":[42.3417,69.5901],
    "Караганда":[49.8061,73.0854]
  };

  let grouped={};

  data.forEach(x=>{
    grouped[x.Город]=(grouped[x.Город]||0)+x.Продажи;
  });

  Object.keys(grouped).forEach(c=>{
    L.circle(coords[c]||[48,68],{
      radius:grouped[c]/5,
      color:"red"
    }).addTo(map).bindPopup(`${c}: ${grouped[c]}`);
  });
}

</script>

</body>
</html>
