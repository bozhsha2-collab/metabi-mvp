<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MetaBI Pro v3</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.kpi {
  font-size: 22px;
  font-weight: bold;
}

canvas {
  margin-top: 10px;
}

input, select {
  padding: 6px;
  margin: 5px;
}
</style>
</head>

<body>

<h1>📊 MetaBI Power Dashboard v3</h1>

<div class="card">
  <label>📅 Date range:</label><br>
  <input type="range" id="range" min="0" max="999" value="999">
  <span id="rangeVal">1000 rows</span>
</div>

<div class="card">
  <label>Region:</label>
  <select id="region"></select>

  <label>Category:</label>
  <select id="category"></select>
</div>

<div class="grid">
  <div class="card"><div>Total</div><div class="kpi" id="total"></div></div>
  <div class="card"><div>Avg</div><div class="kpi" id="avg"></div></div>
  <div class="card"><div>Max</div><div class="kpi" id="max"></div></div>
</div>

<div class="card">
  <canvas id="bar"></canvas>
</div>

<div class="card">
  <canvas id="line"></canvas>
</div>

<div class="card">
  <canvas id="pie"></canvas>
</div>

<script>
let raw = [];

// 🔥 генерим 1000 строк если нет data.json
function generateData() {
  let arr = [];
  const regions = ["North","South","East","West"];
  const cats = ["A","B","C"];

  for (let i=0;i<1000;i++) {
    arr.push({
      Month: "Day " + (i+1),
      Sales: Math.floor(Math.random()*5000),
      Region: regions[Math.floor(Math.random()*4)],
      Category: cats[Math.floor(Math.random()*3)]
    });
  }
  return arr;
}

fetch("data.json")
.then(r => r.json())
.then(d => {
  raw = Array.isArray(d) ? d : generateData();
  init();
  render();
})
.catch(() => {
  raw = generateData();
  init();
  render();
});

function init() {
  const regions = [...new Set(raw.map(x=>x.Region))];
  const cats = [...new Set(raw.map(x=>x.Category))];

  regions.forEach(r => region.appendChild(new Option(r,r)));
  cats.forEach(c => category.appendChild(new Option(c,c)));

  region.onchange = render;
  category.onchange = render;
  range.oninput = render;
}

function filter() {
  let r = region.value;
  let c = category.value;
  let limit = range.value;

  return raw
    .filter(x => (r==="All"||x.Region===r))
    .filter(x => (c==="All"||x.Category===c))
    .slice(0, limit);
}

let bar,line,pie;

function render() {
  let data = filter();

  let total = data.reduce((s,x)=>s+x.Sales,0);
  let avg = data.length ? total/data.length : 0;
  let max = Math.max(...data.map(x=>x.Sales));

  totalEl.innerText = total;
  avgEl.innerText = avg.toFixed(1);
  maxEl.innerText = max;

  let labels = data.map(x=>x.Month);
  let values = data.map(x=>x.Sales);

  if(bar) bar.destroy();
  if(line) line.destroy();
  if(pie) pie.destroy();

  bar = new Chart(barCanvas,{
    type:"bar",
    data:{labels,datasets:[{data:values,label:"Sales"}]}
  });

  line = new Chart(lineCanvas,{
    type:"line",
    data:{labels,datasets:[{data:values,label:"Trend"}]}
  });

  // pie (по регионам)
  let group = {};
  data.forEach(x=>{
    group[x.Region]=(group[x.Region]||0)+x.Sales;
  });

  pie = new Chart(pieCanvas,{
    type:"pie",
    data:{
      labels:Object.keys(group),
      datasets:[{data:Object.values(group)}]
    }
  });
}
</script>

</body>
</html>
