<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MetaBI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

h1 {
  margin-bottom: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 15px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
}

.kpi {
  font-size: 22px;
  font-weight: bold;
}

select {
  padding: 6px;
  margin: 5px;
}

canvas {
  margin-top: 15px;
}
</style>
</head>

<body>

<h1>📊 MetaBI PRO Dashboard</h1>

<div class="card">
  <label>Region:</label>
  <select id="regionFilter">
    <option value="All">All</option>
  </select>

  <label>Category:</label>
  <select id="catFilter">
    <option value="All">All</option>
  </select>
</div>

<div class="grid">
  <div class="card">
    <div>Total Sales</div>
    <div class="kpi" id="total">0</div>
  </div>

  <div class="card">
    <div>Avg Sales</div>
    <div class="kpi" id="avg">0</div>
  </div>

  <div class="card">
    <div>Max Sales</div>
    <div class="kpi" id="max">0</div>
  </div>
</div>

<div class="card">
  <canvas id="barChart"></canvas>
</div>

<div class="card">
  <canvas id="lineChart"></canvas>
</div>

<script>
let rawData = [];

fetch("data.json")
  .then(r => r.json())
  .then(data => {
    rawData = Array.isArray(data) ? data : [];
    initFilters();
    render();
  })
  .catch(err => {
    console.log("Error loading data:", err);
  });

function initFilters() {
  const regions = [...new Set(rawData.map(x => x.Region))];
  const cats = [...new Set(rawData.map(x => x.Category))];

  regions.forEach(r => {
    regionFilter.appendChild(new Option(r, r));
  });

  cats.forEach(c => {
    catFilter.appendChild(new Option(c, c));
  });

  regionFilter.onchange = render;
  catFilter.onchange = render;
}

function getFiltered() {
  const r = regionFilter.value;
  const c = catFilter.value;

  return rawData.filter(x =>
    (r === "All" || x.Region === r) &&
    (c === "All" || x.Category === c)
  );
}

let barChart, lineChart;

function render() {
  const data = getFiltered();

  const safeData = data.map(x => ({
    ...x,
    Sales: Number(x.Sales || 0)
  }));

  const total = safeData.reduce((s, x) => s + x.Sales, 0);
  const avg = safeData.length ? total / safeData.length : 0;
  const max = safeData.length ? Math.max(...safeData.map(x => x.Sales)) : 0;

  document.getElementById("total").innerText = total;
  document.getElementById("avg").innerText = avg.toFixed(2);
  document.getElementById("max").innerText = max;

  const labels = safeData.map(x => x.Month);
  const values = safeData.map(x => x.Sales);

  if (barChart) barChart.destroy();
  if (lineChart) lineChart.destroy();

  barChart = new Chart(barChartCanvas, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Sales",
        data: values
      }]
    }
  });

  lineChart = new Chart(lineChartCanvas, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Trend",
        data: values
      }]
    }
  });
}
</script>

</body>
</html>
