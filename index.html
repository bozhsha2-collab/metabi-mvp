<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MetaBI Pro Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
}

.kpi {
  font-size: 22px;
  font-weight: bold;
}

select {
  padding: 6px;
  margin: 5px;
}
</style>
</head>

<body>

<h1>📊 MetaBI PRO Dashboard</h1>

<div class="card">
  <label>Фильтр Region:</label>
  <select id="regionFilter">
    <option value="All">All</option>
  </select>

  <label>Категория:</label>
  <select id="catFilter">
    <option value="All">All</option>
  </select>
</div>

<div class="grid">

  <div class="card">
    <div>Total Sales</div>
    <div class="kpi" id="total"></div>
  </div>

  <div class="card">
    <div>Avg Sales</div>
    <div class="kpi" id="avg"></div>
  </div>

  <div class="card">
    <div>Max Sales</div>
    <div class="kpi" id="max"></div>
  </div>

</div>

<div class="card">
  <canvas id="barChart"></canvas>
</div>

<div class="card">
  <canvas id="lineChart"></canvas>
</div>

<script>
let raw = [];

fetch("data.json")
  .then(r => r.json())
  .then(d => {
    raw = d;
    initFilters();
    render();
  });

function initFilters() {
  const regions = [...new Set(raw.map(x => x.Region))];
  const cats = [...new Set(raw.map(x => x.Category))];

  regions.forEach(r => {
    let opt = new Option(r, r);
    regionFilter.appendChild(opt);
  });

  cats.forEach(c => {
    let opt = new Option(c, c);
    catFilter.appendChild(opt);
  });

  regionFilter.onchange = render;
  catFilter.onchange = render;
}

function getFiltered() {
  let r = regionFilter.value;
  let c = catFilter.value;

  return raw.filter(x =>
    (r === "All" || x.Region === r) &&
    (c === "All" || x.Category === c)
  );
}

let bar, line;

function render() {
  let data = getFiltered();

  let total = data.reduce((s, x) => s + x.Sales, 0);
  let avg = total / (data.length || 1);
  let max = Math.max(...data.map(x => x.Sales));

  totalEl.innerText = total;
  avgEl.innerText = avg.toFixed(2);
  maxEl.innerText = max;

  let labels = data.map(x => x.Month);
  let values = data.map(x => x.Sales);

  if (bar) bar.destroy();
  if (line) line.destroy();

  bar = new Chart(barChart, {
    type: "bar",
    data: {
      labels,
      datasets: [{ label: "Sales", data: values }]
    }
  });

  line = new Chart(lineChart, {
    type: "line",
    data: {
      labels,
      datasets: [{ label: "Trend", data: values }]
    }
  });
}
</script>

</body>
</html>
