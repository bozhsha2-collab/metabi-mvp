<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MetaBI Fixed Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.kpi {
  font-size: 22px;
  font-weight: bold;
}

select, input, button {
  padding: 6px;
  margin: 5px;
}

canvas {
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>📊 MetaBI Fixed Dashboard</h1>

<!-- FILTERS -->
<div class="card">
  <label>Region:</label>
  <select id="region"><option value="All">All</option></select>

  <label>Category:</label>
  <select id="category"><option value="All">All</option></select>

  <label>Rows:</label>
  <input type="range" id="range" min="50" max="1000" value="1000">
  <span id="rangeVal">1000</span>
</div>

<!-- EXPORT -->
<div class="card">
  <button onclick="exportCSV()">📥 Export CSV</button>
</div>

<!-- KPI -->
<div class="grid">
  <div class="card">
    <div>Total</div>
    <div class="kpi" id="total">0</div>
  </div>

  <div class="card">
    <div>Avg</div>
    <div class="kpi" id="avg">0</div>
  </div>

  <div class="card">
    <div>Max</div>
    <div class="kpi" id="max">0</div>
  </div>
</div>

<!-- CHARTS -->
<div class="card"><canvas id="bar"></canvas></div>
<div class="card"><canvas id="line"></canvas></div>
<div class="card"><canvas id="pie"></canvas></div>

<!-- MAP -->
<div class="card">
  <h3>🗺️ Map</h3>
  <div id="map" style="height: 300px;"></div>
</div>

<script>

let raw = [];

/* ---------- fallback generator ---------- */
function generateData() {
  const regions = ["North","South","East","West","Central"];
  const cats = ["A","B","C","D"];
  let arr = [];

  for (let i=0;i<1000;i++) {
    arr.push({
      Date: "2025-01-" + ((i%30)+1),
      Month: "M" + ((i%12)+1),
      Sales: Math.floor(Math.random()*5000+200),
      Region: regions[Math.floor(Math.random()*regions.length)],
      Category: cats[Math.floor(Math.random()*cats.length)]
    });
  }
  return arr;
}

/* ---------- load ---------- */
fetch("./data.json")
.then(r => r.json())
.then(d => {
  raw = Array.isArray(d) && d.length ? d : generateData();
  init();
  render();
})
.catch(() => {
  raw = generateData();
  init();
  render();
});

/* ---------- init ---------- */
function init() {
  const regions = [...new Set(raw.map(x=>x.Region))];
  const cats = [...new Set(raw.map(x=>x.Category))];

  regions.forEach(r => region.appendChild(new Option(r,r)));
  cats.forEach(c => category.appendChild(new Option(c,c)));

  region.onchange = render;
  category.onchange = render;
  range.oninput = render;

  initMap();
}

/* ---------- filter ---------- */
function filter() {
  return raw
    .filter(x => region.value==="All" || x.Region===region.value)
    .filter(x => category.value==="All" || x.Category===category.value)
    .slice(0, range.value);
}

/* ---------- charts ---------- */
let barChart,lineChart,pieChart,map;

function render() {

  let data = filter();
  if(!data.length) return;

  let total = data.reduce((s,x)=>s+Number(x.Sales||0),0);
  let avg = data.length ? total/data.length : 0;
  let max = data.length ? Math.max(...data.map(x=>x.Sales)) : 0;

  /* ✅ FIX KPI (ВАЖНО) */
  document.getElementById("total").innerText = total;
  document.getElementById("avg").innerText = avg.toFixed(1);
  document.getElementById("max").innerText = max;

  let labels = data.map(x=>x.Month);
  let values = data.map(x=>Number(x.Sales));

  if(barChart) barChart.destroy();
  if(lineChart) lineChart.destroy();
  if(pieChart) pieChart.destroy();

  barChart = new Chart(document.getElementById("bar"),{
    type:"bar",
    data:{labels,datasets:[{label:"Sales",data:values}]}
  });

  lineChart = new Chart(document.getElementById("line"),{
    type:"line",
    data:{labels,datasets:[{label:"Trend",data:values}]}
  });

  let grouped = {};
  data.forEach(x=>{
    grouped[x.Region]=(grouped[x.Region]||0)+Number(x.Sales);
  });

  pieChart = new Chart(document.getElementById("pie"),{
    type:"pie",
    data:{
      labels:Object.keys(grouped),
      datasets:[{data:Object.values(grouped)}]
    }
  });

  updateMap(data);
}

/* ---------- export ---------- */
function exportCSV() {
  let data = filter();
  let csv = "Date,Month,Sales,Region,Category\n";

  data.forEach(x=>{
    csv += `${x.Date},${x.Month},${x.Sales},${x.Region},${x.Category}\n`;
  });

  let blob = new Blob([csv],{type:"text/csv"});
  let url = URL.createObjectURL(blob);

  let a=document.createElement("a");
  a.href=url;
  a.download="metabi.csv";
  a.click();
}

/* ---------- map ---------- */
function initMap() {
  map = L.map("map").setView([48,68],4);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"MetaBI"
  }).addTo(map);
}

function updateMap(data) {
  if(!map) return;

  map.eachLayer(l=>{
    if(l._latlng) map.removeLayer(l);
  });

  const coords = {
    North:[53,70],
    South:[42,69],
    East:[49,82],
    West:[44,63],
    Central:[48,71]
  };

  let grouped={};

  data.forEach(x=>{
    grouped[x.Region]=(grouped[x.Region]||0)+Number(x.Sales);
  });

  Object.keys(grouped).forEach(r=>{
    L.marker(coords[r]||[48,68])
      .addTo(map)
      .bindPopup(`${r}: ${grouped[r]}`);
  });
}

</script>

</body>
</html>
